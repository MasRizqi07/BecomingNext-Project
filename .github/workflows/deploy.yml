name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub Environment to deploy
        type: choice
        required: true
        options:
          - staging
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:e2e:visual

  deploy:
    needs: visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIRESTORE_DATABASE_ID: ${{ vars.VITE_FIRESTORE_DATABASE_ID }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm --prefix functions ci
      - run: npx playwright install --with-deps chromium firefox webkit chrome
      - run: npm run verify:full
      - name: Select the Functions deployment runtime
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate Functions on Node 22
        run: |
          npm --prefix functions run typecheck
          npm --prefix functions test
          npm run test:transactions
          npm run test:e2e:auth
          npm --prefix functions run build
          npm --prefix functions audit --omit=dev --audit-level=high
          npm run test:evidence
      - name: Upload pre-deploy browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pre-deploy-browser-evidence-${{ inputs.environment }}-${{ github.sha }}
          path: |
            test-results/public
            test-results/phase1
            test-results/auth
            playwright-report/public
            playwright-report/phase1
            playwright-report/auth
          if-no-files-found: error
          retention-days: 30
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules, indexes, and TTL policy
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only firestore --non-interactive
      - name: Deploy Functions and Hosting
        run: npx firebase-tools deploy --project "$FIREBASE_PROJECT_ID" --only functions,hosting --non-interactive
