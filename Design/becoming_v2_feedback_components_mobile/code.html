<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<title>Becoming V2 - Global Feedback (Mobile)</title>

            darkMode: "class",

                extend: {

                        "on-secondary-fixed-variant": "#4a3d7c",
                        "surface-container-lowest": "#0e0e14",

                        "primary-container": "#67e8f9",

                        "on-tertiary-fixed": "#251a00",
                        "surface-container-highest": "#35343b",
                        "secondary-container": "#4a3d7c",
                        "on-primary-container": "#006771",
                        "surface-container-low": "#1b1b21",
                        "on-primary": "#00363c",
                        "secondary-fixed": "#e7deff",
                        "accent-strong": "#22D3EE",
                        "background": "#131319",
                        "error-container": "#93000a",
                        "text-tertiary": "#94A3B8",
                        "surface-1": "#090A0F",
                        "success": "#86EFAC",
                        "on-surface": "#e4e1ea",
                        "on-secondary-fixed": "#1e0e4e",
                        "tertiary-fixed-dim": "#edc150",
                        "border": "rgba(255, 255, 255, 0.12)",
                        "on-primary-fixed-variant": "#004f57",
                        "outline-variant": "#3c494b",
                        "primary": "#d5f9ff",
                        "on-background": "#e4e1ea",
                        "primary-fixed-dim": "#54d8e8",
                        "tertiary-container": "#ffd15e",
                        "text-primary": "#F8FAFC",
                        "error": "#ffb4ab",
                        "inverse-on-surface": "#303037",
                        "surface-tint": "#54d8e8",
                        "surface-container-high": "#2a2930",
                        "surface-container": "#1f1f25",

                    "borderRadius": {

                    },
                    "spacing": {

                }
            }
        }
    </script>
<style>
        body { background-color: #020205; }
        .glass-panel { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .success-border { border: 1px solid #86EFAC; }
        .warning-border { border: 1px solid #FCD34D; }
        .dialog-overlay { background-color: rgba(2, 2, 5, 0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-background text-text-primary font-body antialiased min-h-screen relative overflow-hidden flex flex-col md:hidden">
<!-- Canvas / Background Context -->
<div class="flex-1 px-margin-mobile pt-24 pb-32 overflow-y-auto">
<h1 class="font-h1-mobile text-h1-mobile text-text-primary mb-6">Reflection <span class="font-editorial-italic text-editorial-italic text-text-secondary">Journal</span></h1>
<div class="space-y-6">
<div class="bg-surface-1 border border-border p-6 rounded-xl">
<p class="font-body text-body text-text-secondary">How did you approach your goals today?</p>
<textarea class="w-full bg-surface-2 border border-border rounded-lg mt-4 p-4 text-text-primary focus:border-accent-strong focus:outline-none focus:ring-1 focus:ring-accent-strong min-h-[120px]" placeholder="Start typing..."></textarea>
</div>
<button class="w-full bg-primary-container text-on-primary-container font-label text-label py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-opacity-90 transition-colors" onclick="document.getElementById('success-toast').classList.remove('translate-y-[150%]')">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                 Save Reflection
             </button>
<button class="w-full bg-surface-2 border border-border text-text-primary font-label text-label py-4 rounded-lg flex items-center justify-center gap-2 mt-4 hover:border-border-strong transition-colors" onclick="document.getElementById('exit-dialog').classList.remove('translate-y-full')">
                 Simulate Exit Attempt
             </button>
<button class="w-full text-warning font-label text-label py-4 flex items-center justify-center gap-2 mt-4" onclick="document.getElementById('offline-alert').classList.remove('-translate-y-[150%]')">
                 Simulate Offline
             </button>
</div>
</div>
<!-- 2. Offline / Polling Paused Alert (Sticky Top) -->
<div class="fixed top-margin-mobile left-margin-mobile right-margin-mobile z-50 transition-transform duration-300 transform -translate-y-[150%]" id="offline-alert">
<div class="bg-surface-1 warning-border rounded-lg p-4 flex items-center justify-between shadow-lg glass-panel">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-warning" style="font-variation-settings: 'FILL' 1;">warning</span>
<span class="font-small text-small text-text-primary">Connection lost. Synthesis paused.</span>
</div>
<button class="font-label text-label text-accent-strong hover:text-primary transition-colors" onclick="this.closest('#offline-alert').classList.add('-translate-y-[150%]')">
                Retry
            </button>
</div>
</div>
<!-- 1. Success Toast (Bottom-center) -->
<div class="fixed bottom-24 left-margin-mobile right-margin-mobile z-50 transition-transform duration-300 transform translate-y-[150%] flex justify-center" id="success-toast">
<div class="bg-surface-1 success-border rounded-full py-3 px-6 flex items-center gap-3 shadow-lg glass-panel">
<span class="material-symbols-outlined text-success" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-small text-small text-text-primary">Check-in recorded</span>
</div>
<script>
            // Auto hide for demo
            document.getElementById('success-toast').addEventListener('transitionend', function(e) {
                if(!this.classList.contains('translate-y-[150%]')) {
                    setTimeout(() => {
                        this.classList.add('translate-y-[150%]');
                    }, 3000);
                }
            });
        </script>
</div>
<!-- 3. Unsaved Changes Exit Dialog (Bottom Sheet) -->
<div class="fixed inset-0 z-50 flex items-end justify-center dialog-overlay transition-transform duration-300 transform translate-y-full" id="exit-dialog">
<div class="bg-surface-1 w-full rounded-t-xl border-t border-border p-6 pb-12 flex flex-col gap-6" onclick="event.stopPropagation()">
<div class="flex flex-col gap-2 items-center text-center">
<div class="w-12 h-1 bg-border rounded-full mb-4"></div>
<h3 class="font-h3 text-h3 text-text-primary">Unsaved Progress</h3>
<p class="font-body text-body text-text-secondary">You have unsaved answers. Leave anyway or continue reflecting?</p>
</div>
<div class="flex flex-col gap-3 mt-4 w-full">
<button class="w-full bg-primary-container text-on-primary-container font-label text-label py-4 rounded-lg flex justify-center items-center h-[44px]" onclick="document.getElementById('exit-dialog').classList.add('translate-y-full')">
                    Keep reflecting
                </button>
<button class="w-full text-text-tertiary hover:text-text-primary font-label text-label py-4 rounded-lg flex justify-center items-center h-[44px] transition-colors" onclick="document.getElementById('exit-dialog').classList.add('translate-y-full')">
                    Leave without saving
                </button>
</div>
</div>
<!-- Click outside to close -->
<div class="absolute inset-0 z-[-1]" onclick="document.getElementById('exit-dialog').classList.add('translate-y-full')"></div>
</div>
<!-- Base Nav Shell (For Context, mostly suppressed by intent, but included to anchor the "bottom" area relative to toasts) -->
<div class="fixed bottom-0 left-0 w-full z-40 bg-surface-2/90 backdrop-blur-md border-t border-border-strong px-4 py-3 flex justify-around items-center">
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">fingerprint</span>
<span class="font-label text-label mt-1">Identity</span>
</div>
<div class="flex flex-col items-center justify-center text-accent-strong font-bold">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">alt_route</span>
<span class="font-label text-label mt-1">Reflect</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined">timeline</span>
<span class="font-label text-label mt-1">Timeline</span>
</div>
</div>
</body></html>
