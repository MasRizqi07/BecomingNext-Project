<!-- Overlay -->
<div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40"></div>
<!-- Modal Container -->
<div aria-labelledby="modal-title" aria-modal="true" class="relative z-50 w-full max-w-sm bg-surface-1 border border-danger rounded-xl shadow-2xl p-6 flex flex-col gap-6" role="dialog">
<!-- Header -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-center w-12 h-12 rounded-full bg-error-container/20 mb-2">
<span class="material-symbols-outlined text-danger" style="font-variation-settings: 'FILL' 1;">warning</span>
</div>
<h2 class="font-h3 text-h3 text-danger" id="modal-title">Permanently Delete Account &amp; Data?</h2>
</div>
<!-- Warning Notice -->
<div class="bg-error-container/10 border border-error-container/30 rounded-lg p-4">
<p class="font-small text-small text-danger/90">
                This action is irreversible. The following data will be wiped immediately:
            </p>
<ul class="list-disc list-inside mt-2 font-small text-small text-text-secondary space-y-1">
<li>All reflection inputs</li>
<li>AI trajectory analyses</li>
<li>Check-in history</li>
<li>Google auth link</li>
</ul>
</div>
<!-- Confirmation Input -->
<div class="flex flex-col gap-2">
<label class="font-label text-label text-text-secondary" for="delete-confirm">
                To confirm, type <span class="font-bold text-text-primary">DELETE</span> below:
            </label>
<input autocomplete="off" class="w-full bg-surface-2 border border-border rounded-lg px-4 py-3 font-body text-body text-text-primary focus:outline-none focus:border-danger focus:ring-1 focus:ring-danger transition-colors duration-200 placeholder-text-tertiary" id="delete-confirm" name="delete-confirm" placeholder="DELETE" type="text"/>
</div>
<!-- Actions -->
<div class="flex flex-col gap-3 mt-2">
<button class="w-full bg-danger text-on-error font-label text-label py-4 rounded-lg flex items-center justify-center gap-2 hover:bg-danger/90 active:scale-[0.98] transition-all duration-150">
<span class="material-symbols-outlined text-[18px]">delete_forever</span>
                Permanently Purge All Data
            </button>
<button class="w-full bg-transparent border border-border-strong text-text-primary font-label text-label py-4 rounded-lg hover:bg-surface-2 active:scale-[0.98] transition-all duration-150">
                Cancel, keep my data
            </button>
