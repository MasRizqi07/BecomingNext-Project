    <style>
      .orb {
        position: absolute;
        width: 40vw;
        height: 40vw;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(103, 232, 249, 0.15) 0%,
          rgba(103, 232, 249, 0) 70%
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulse 8s infinite alternate;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes pulse {
        0% {
          transform: translate(-50%, -50%) scale(0.9);
          opacity: 0.6;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.1);
          opacity: 1;
        }
      }

      .glass-card {
        background: rgba(9, 10, 15, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .success-icon-container {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: rgba(134, 239, 172, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 32px;
        border: 1px solid rgba(134, 239, 172, 0.2);
        box-shadow: 0 0 20px rgba(134, 239, 172, 0.1);
      }
    </style>

  <body
    class="bg-background text-text-primary min-h-screen flex items-center justify-center relative overflow-hidden font-body selection:bg-accent-strong selection:text-background"

    <!-- Ambient Glowing Orb Background -->
    <div aria-hidden="true" class="orb"></div>
    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-lg px-margin-mobile md:px-0 flex flex-col items-center">
      <!-- Success Card -->
      <div
        class="glass-card w-full rounded-[24px] p-[24px] md:p-12 text-center shadow-2xl flex flex-col items-center animate-fade-in-up"
      >
        <!-- Success Icon -->
        <div class="success-icon-container">
          <span
            class="material-symbols-outlined text-[40px] text-success"
            style="font-variation-settings: 'FILL' 1"
          >
            check_circle
          </span>
        </div>
        <!-- Typography -->
        <h1 class="font-h2 text-h2 md:font-h1 md:text-h1 mb-4 text-text-primary">
          Progress recorded.
        </h1>
        <p class="font-body-lg text-body-lg text-text-secondary mb-10 max-w-[320px] mx-auto">
          Your reflections have been added to your trajectory history.
        </p>
        <!-- Actions -->
        <div class="flex flex-col sm:flex-row gap-4 w-full justify-center mt-2">
          <button
            class="bg-surface-2 border border-border hover:border-border-strong text-text-primary px-8 py-4 rounded-full font-label text-label transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-background"
          >
            Return to Dashboard
          </button>

            class="bg-primary-container text-on-primary px-8 py-4 rounded-full font-label text-label hover:bg-surface-tint transition-all duration-200 shadow-[0_0_15px_rgba(103,232,249,0.3)] hover:shadow-[0_0_25px_rgba(103,232,249,0.5)] focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-background"
          >
            View Full Analysis
          </button>
        </div>
      </div>
    </main>
