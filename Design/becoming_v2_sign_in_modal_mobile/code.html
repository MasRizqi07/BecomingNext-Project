<style>
        .drawer-slide-up {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }

            animation: fadeIn 0.3s ease-out forwards;

<body class="bg-background min-h-screen text-text-primary antialiased flex flex-col items-center justify-center relative overflow-hidden font-body">
<!-- Background Context (Mocking the underlying app screen slightly) -->
<div class="absolute inset-0 w-full h-full bg-surface-container-lowest z-0 flex flex-col pt-12 px-margin-mobile">
<div class="w-full h-32 rounded-xl border border-border bg-surface-2 mb-4 animate-pulse"></div>
<div class="w-3/4 h-8 rounded-lg border border-border bg-surface-2 mb-8 animate-pulse"></div>
<div class="w-full h-48 rounded-xl border border-border bg-surface-2 animate-pulse"></div>
</div>
<!-- Backdrop Overlay -->
<div aria-hidden="true" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 fade-in" id="auth-backdrop"></div>
<!-- Sign In Drawer / Modal -->
<div aria-labelledby="modal-title" aria-modal="true" class="fixed bottom-0 left-0 w-full md:w-auto md:min-w-[400px] md:bottom-auto md:top-1/2 md:-translate-y-1/2 md:left-1/2 md:-translate-x-1/2 z-50 drawer-slide-up flex flex-col" role="dialog">
<!-- Mobile drag handle area -->
<div class="w-full flex justify-center pt-3 pb-1 md:hidden bg-transparent z-10 absolute top-[-24px]">
<div class="w-12 h-1.5 bg-on-surface-variant/40 rounded-full"></div>
</div>
<!-- Glass Container -->
<div class="bg-surface-1/90 backdrop-blur-xl border border-border border-b-0 md:border-b rounded-t-[32px] md:rounded-[32px] p-8 pb-12 w-full h-full shadow-2xl relative overflow-hidden">
<!-- Close Button -->
<button aria-label="Close modal" class="absolute top-6 right-6 p-2 rounded-full bg-surface-2 hover:bg-surface-3 transition-colors border border-border/50 text-text-secondary hover:text-text-primary flex items-center justify-center focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-surface-1 group">
<span class="material-symbols-outlined text-[20px] group-hover:rotate-90 transition-transform duration-300">close</span>
</button>
<!-- Content Container -->
<div class="flex flex-col items-center text-center mt-4">
<!-- Brand Icon with Glow -->
<div class="relative w-16 h-16 flex items-center justify-center mb-6">
<div class="absolute inset-0 bg-accent-strong/20 rounded-full blur-xl animate-pulse"></div>
<div class="w-12 h-12 bg-surface-2 border border-border rounded-xl flex items-center justify-center relative z-10 shadow-lg">
<span class="material-symbols-outlined text-accent-strong text-2xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">fingerprint</span>
</div>
</div>
<!-- Headers -->
<h2 class="font-h2 text-h2 text-text-primary mb-3" id="modal-title">
                    Your reflection is private
                </h2>
<p class="font-body text-body text-text-secondary mb-10 max-w-xs">
                    Sign in to securely sync your paths, timelines, and plans across devices.
                </p>
<!-- Action Button -->
<button class="w-full h-12 bg-text-primary text-background rounded-lg font-label text-label flex items-center justify-center gap-3 hover:bg-white/90 active:scale-95 transition-all focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-surface-1 shadow-lg shadow-white/5">

<span class="material-symbols-outlined text-[16px] opacity-70">lock</span>

                </p>
<div class="mt-4 font-label text-[10px] text-text-tertiary uppercase tracking-widest opacity-60">
