<style>
        body {
            background-color: #020205; /* The Canvas */
            color: #F8FAFC;
        }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .score-btn {
            width: 44px;
            height: 44px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            transition: all 120ms ease;
            cursor: pointer;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
        }

        .score-btn:hover {
            border-color: rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.08);
        }

        .score-btn.active {
            background: #67E8F9;
            color: #000;
            border-color: #67E8F9;
            box-shadow: 0 0 12px rgba(103, 232, 249, 0.3);
        }

        .input-focus-ring:focus {
            outline: none;
            border-color: #67E8F9;
            box-shadow: 0 0 8px rgba(103, 232, 249, 0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body antialiased">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-6 md:p-12 relative z-10">
<!-- Reading Width Container -->
<div class="w-full max-w-[720px] flex flex-col gap-12">
<!-- Header Section -->
<header class="flex flex-col gap-4 text-center md:text-left mt-12 md:mt-0">
<span class="font-label text-label text-accent-strong uppercase tracking-widest">DISCIPLINE &amp; EXECUTION</span>
<h1 class="font-h1 text-h1 text-text-primary">On a scale of 1–10, how consistent was your focus over the last 7 days?</h1>
</header>
<!-- Interaction Section (Glassmorphism Card) -->
<section class="glass-panel rounded-2xl p-8 md:p-10 flex flex-col gap-10 shadow-2xl relative overflow-hidden">
<!-- Decorative background glow inside card -->
<div class="absolute -top-24 -right-24 w-64 h-64 bg-primary-container rounded-full blur-[100px] opacity-10 pointer-events-none"></div>
<!-- Score Selector -->
<div class="flex flex-col gap-4 relative z-10">
<div class="flex justify-between items-center w-full flex-wrap gap-2" id="score-container">
<!-- Score buttons 1-10 -->
<button class="score-btn font-body text-body text-text-primary" data-score="1">1</button>
<button class="score-btn font-body text-body text-text-primary" data-score="2">2</button>
<button class="score-btn font-body text-body text-text-primary" data-score="3">3</button>
<button class="score-btn font-body text-body text-text-primary" data-score="4">4</button>
<button class="score-btn font-body text-body text-text-primary" data-score="5">5</button>
<button class="score-btn font-body text-body text-text-primary" data-score="6">6</button>
<button class="score-btn font-body text-body text-text-primary" data-score="7">7</button>
<button class="score-btn font-body text-body text-text-primary" data-score="8">8</button>
<button class="score-btn font-body text-body text-text-primary" data-score="9">9</button>
<button class="score-btn font-body text-body text-text-primary" data-score="10">10</button>
</div>
<div class="flex justify-between w-full px-2">
<span class="font-small text-small text-text-tertiary">Distracted</span>
<span class="font-small text-small text-text-tertiary">Locked In</span>
</div>
</div>
<!-- Text Area -->
<div class="flex flex-col gap-3 relative z-10">
<label class="font-label text-label text-text-secondary" for="reason">Briefly describe the reason for this score.</label>
<textarea class="w-full bg-surface-1 border border-border rounded-lg p-4 font-body text-body text-text-primary placeholder:text-text-tertiary resize-none input-focus-ring transition-colors duration-200" id="reason" placeholder="What helped or hindered your focus this week?" rows="3"></textarea>
</div>
</section>
</div>
</main>
<!-- Navigation Footer -->
<footer class="w-full bg-surface-1 border-t border-border py-6 px-margin-mobile md:px-margin-desktop sticky bottom-0 z-50">
<div class="max-w-[1200px] mx-auto flex justify-between items-center w-full">
<button class="flex items-center gap-2 px-6 py-3 rounded-lg border border-border bg-surface-2 text-text-primary font-label text-label uppercase hover:border-border-strong hover:bg-surface-3 transition-all duration-120">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
                Back
            </button>
<button class="flex items-center gap-2 px-8 py-3 rounded-lg bg-primary-container text-surface-container-lowest font-label text-label uppercase font-bold hover:bg-primary-fixed transition-colors duration-120 shadow-[0_0_16px_rgba(103,232,249,0.15)]">
                Continue
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</footer>
<script>
        // Simple vanilla JS for the score selection micro-interaction
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.score-btn');
            
            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    // Remove active state from all
                    buttons.forEach(b => {
                        b.classList.remove('active');
                        b.classList.add('text-text-primary');
                    });
                    
                    // Add active state to clicked
                    button.classList.add('active');
                    button.classList.remove('text-text-primary');
                });
            });
        });
    </script>
</body></html>
