<style>
        .orb-warning {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(252, 165, 165, 0.4), rgba(147, 0, 10, 0.1) 60%, transparent 80%);
            box-shadow: inset 0 0 40px rgba(252, 165, 165, 0.2), 0 0 60px rgba(252, 165, 165, 0.1);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orb-warning::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 1px dashed rgba(252, 165, 165, 0.3);
        }
    </style>

<body class="bg-surface text-text-primary min-h-screen flex items-center justify-center font-body selection:bg-accent-strong selection:text-surface p-4">
<!-- Ambient Background Glow -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-danger/5 rounded-full blur-[120px] opacity-50"></div>
</div>
<!-- Main Container -->
<main class="relative z-10 w-full max-w-[600px] bg-surface-1/90 backdrop-blur-xl border border-border rounded-xl p-8 md:p-12 shadow-2xl flex flex-col items-center text-center">
<!-- Warning Visual (Muted Orb) -->
<div aria-hidden="true" class="mb-8">
<div class="orb-warning">
<span class="material-symbols-outlined text-danger text-[40px] opacity-80" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                    error
                </span>
</div>
</div>
<!-- Copy -->
<h1 class="font-h2 text-h2 text-text-primary mb-4 tracking-tight">Synthesis paused.</h1>
<p class="font-body text-body text-text-secondary max-w-[400px] mx-auto mb-10">
            Your answers are completely safe. The AI engine encountered a momentary delay while processing your reflections.
        </p>
<!-- Actions -->
<div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
<button class="bg-primary-container text-on-primary-container font-label text-label px-8 py-4 rounded-full hover:bg-surface-tint transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-surface-1 flex items-center justify-center gap-2 min-w-[200px]">
<span class="material-symbols-outlined text-[18px]">refresh</span>
                Retry Analysis
            </button>
<button class="bg-transparent border border-border-strong text-text-primary font-label text-label px-8 py-4 rounded-full hover:bg-surface-2 transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-accent-strong focus:ring-offset-2 focus:ring-offset-surface-1 flex items-center justify-center gap-2 min-w-[200px]">

</div>
