<style>
        body {

        /* Orb Animation */
        .orb-container {
            position: relative;
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .orb-core {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(103,232,249,0.8) 0%, rgba(34,211,238,0.2) 70%, transparent 100%);
            box-shadow: 0 0 60px rgba(103,232,249,0.4), inset 0 0 20px rgba(255,255,255,0.5);
            animation: pulse 4s ease-in-out infinite alternate;
        }

        .orb-ring-1, .orb-ring-2, .orb-ring-3 {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(103,232,249,0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orb-ring-1 {
            width: 200px;
            height: 200px;
            animation: rotate 20s linear infinite;
            border-top-color: rgba(103,232,249,0.4);
            border-bottom-color: rgba(103,232,249,0.4);
        }

        .orb-ring-2 {
            width: 260px;
            height: 260px;
            animation: rotate-reverse 30s linear infinite;
            border-left-color: rgba(34,211,238,0.3);
            border-right-color: rgba(34,211,238,0.3);
        }
        
        .orb-ring-3 {
            width: 320px;
            height: 320px;
            animation: rotate 40s linear infinite;
            border: 1px dashed rgba(103,232,249,0.1);
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        @keyframes rotate {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotate-reverse {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @media (prefers-reduced-motion: reduce) {
            .orb-core, .orb-ring-1, .orb-ring-2, .orb-ring-3 {
                animation: none;
            }
        }
    </style>
